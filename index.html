<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Office</title>
    <meta name="description" content="A living pixel-art office for your Grok Bot agent team. Click, hover, and watch them work." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pixel Office — your Grok agent team, visualized" />
    <meta property="og:description" content="A living pixel-art office for the Grok Bot agents on your floor. Click, hover, and watch them work." />
    <meta property="og:image" content="https://abdelrahmanmagdii.github.io/pixel-office/og-image.png" />
    <meta property="og:url" content="https://abdelrahmanmagdii.github.io/pixel-office/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pixel Office — your Grok agent team, visualized" />
    <meta name="twitter:description" content="A living pixel-art office for the Grok Bot agents on your floor." />
    <meta name="twitter:image" content="https://abdelrahmanmagdii.github.io/pixel-office/og-image.png" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="logo">■</span>
          <div>
            <h1>Pixel Office</h1>
            <p>Your agent floor — click an agent for details</p>
          </div>
        </div>
        <div id="demo-controls">
          <button id="btn-randomize" type="button">Randomize busy states</button>
          <button id="btn-demo" type="button">Play tour</button>
          <button id="btn-toggle-cos" type="button">Toggle CoS: Desk</button>
        </div>
      </header>
      <main id="stage-wrap">
        <div id="game-container"></div>
        <aside id="agent-panel" class="hidden" aria-live="polite">
          <button id="panel-close" type="button" aria-label="Close">×</button>
          <div id="panel-swatch"></div>
          <h2 id="panel-name">—</h2>
          <p id="panel-role" class="muted">—</p>
          <dl>
            <div><dt>Id</dt><dd id="panel-id">—</dd></div>
            <div><dt>Status</dt><dd id="panel-status">—</dd></div>
            <div><dt>Location</dt><dd id="panel-location">—</dd></div>
            <div><dt>Last task</dt><dd id="panel-task">—</dd></div>
          </dl>
          <div id="panel-actions">
            <button type="button" class="status-btn" data-status="idle">Idle</button>
            <button type="button" class="status-btn" data-status="working">Working</button>
            <button type="button" class="status-btn" data-status="waiting">Waiting</button>
            <button type="button" id="btn-panel-cos" class="hidden">Toggle CoS: Patrol</button>
          </div>
          <p id="panel-tip" class="muted">Hover for highlight · click bubble to dismiss</p>
        </aside>
      </main>
      <footer id="hint">
        WASD / arrows pan · scroll zoom · hover/click agent · click bubble or floor to dismiss · demo buttons above
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
