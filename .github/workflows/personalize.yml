name: Personalize my office

on:
  workflow_dispatch:
    inputs:
      office_title:
        description: 'Office title'
        required: false
        default: 'Pixel Office'
      bots:
        description: 'One bot name per line (first becomes the Chief), or a JSON roster per SCHEMA.md'
        required: true

# contents: write — commit agents.json
# pages + id-token — deploy GitHub Pages from this run
# The default GITHUB_TOKEN cannot trigger pages.yml via push, so this
# workflow builds and deploys the site itself. No personal access token.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  personalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Generate agents.json
        env:
          BOTS: ${{ github.event.inputs.bots }}
          TITLE: ${{ github.event.inputs.office_title }}
        run: |
          printf '%s' "$BOTS" > /tmp/bots.txt
          node scripts/personalize.mjs /tmp/bots.txt "$TITLE"

      - name: Commit and push
        run: |
          git config user.name "pixel-office[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add public/agents.json
          git diff --cached --quiet || git commit -m "Personalize office roster"
          git push

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ./

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: personalize
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
